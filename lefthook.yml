output:
  - execution
  - execution_out
  - execution_info
  - summary

pre-commit:
  parallel: true
  commands:
    lint-and-format-check:
      glob: "*.{ts,tsx,js,jsx}"
      run: pnpm run lint {staged_files}
    typecheck:
      run: pnpm run typecheck

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}
