output:
  - execution
  - execution_out
  - execution_info
  - summary

pre-commit:
  parallel: true
  commands:
    lint-and-format-check:
      glob: "*.{ts,tsx,js,jsx}"
      run: pnpm run lint

commit-msg:
  commands:
    message-check:
      run: |
        if ! grep -qE "^(feat|fix|refactor|chore): " {1}; then
          echo "🔥 Commit message must start with: feat|fix|refactor|chore"
          exit 1
        fi
